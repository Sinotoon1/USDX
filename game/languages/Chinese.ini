ABOUT_OVERVIEW=UltraStar Deluxe 是一款开源电脑卡拉 OK 游戏。你可以导入社区曲谱，也可以制作自己的歌曲，在电脑上跟随旋律演唱。\n公开的源代码允许你按自己的需求调整游戏、创建主题、扩展功能，并与社区分享改进。\n\n派对模式支持多位玩家轮流演唱，根据音高和节奏获得分数。本教唱版本还提供逐句循环的练习模式，练习成绩不写入游戏高分榜。


